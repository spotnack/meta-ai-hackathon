# The yarn workspace (client/, server/, package.json) lives two levels below
# this repo's root, at src/spotnack-muse/. Every step below runs there via
# defaults.run.working-directory.

name: CI # The name of the workflow.

on: # Trigger the workflow to run on push or pull request events.
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: src/spotnack-muse

jobs:
  lint-and-test: # The name of the first job.
    runs-on: ubuntu-latest # The operating system (a.k.a runner) on which the job will run.
    permissions: # The permissions for the job.
      issues: write
      pull-requests: write
    steps: # The steps to be executed in the job.
      # Checkout the repository:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------- Setup Node.js and install dependencies --------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Enable Corepack (for the pinned Yarn version)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint (client + server)
        run: yarn lint

      - name: Test (client + server)
        run: yarn test

      # -------- Python Linting --------
      - name: Set up Python
        uses: actions/setup-python@v4 # The Python environment for the job.
        with: 
          python-version: "3.11.0" # Should match the version defined in environment.yml.

      - name: Install Python dependencies
        run: pip install --only-binary=:all: black==26.3.1 flake8==7.3.0

      - name: Run Black
        run: black --check .

      - name: Run Flake8
        run: flake8 .